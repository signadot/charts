# Default values for signadot operator
# All values are optional - defaults are embedded in templates


# Namespace where the operator is deployed.
# Defaults to "signadot". Override this if your organization's namespace
# naming policy requires a different namespace name.
# Example:
#   namespace: signadot-custom-ns
namespace: signadot


# Common settings
# -----------------------------------------------------------------------------

# Add these labels to all objects deployed by this chart.
# commonLabels:
#   exampleCommonLabel: exampleCommonLabelValue

# Add these annotations to all objects deployed by this chart.
# commonAnnotations:
#   exampleCommonAnnotation: exampleCommonAnnotationValue

# Add these labels to all Pods deployed by this chart.
# podLabels:
#   examplePodLabel: examplePodLabelValue

# Add these annotations to all Pods deployed by this chart.
# podAnnotations:
#   examplePodAnnotation: examplePodAnnotationValue

# Add these labels to all Services deployed by this chart.
# serviceLabels:
#   exampleServiceLabel: exampleServiceLabelValue

# Add these annotations to all Services deployed by this chart.
# serviceAnnotations:
#   exampleServiceAnnotation: exampleServiceAnnotationValue

# Image pull secrets for all deployments
# imagePullSecrets:
#   - my-registry-secret

# By default, this chart will install the operator in
# cluster-wide mode, where it watches all namespaces.
# Uncomment the following to configure the operator to
# only watch specific namespaces.
# allowedNamespaces:
#   - ns1
#   - ns2


# Istio settings
# -----------------------------------------------------------------------------
# istio:
#   # Enable the integration with Istio
#   enabled: true
#   gatewayAPI:
#     enabled: false
#   operator:
#     # Pod labels for operator workloads on the Istio mesh
#     # Defaults to: sidecar.istio.io/inject: "true"
#     podLabels:
#       # For ambient mode with waypoint:
#       istio.io/dataplane-mode: ambient
#       istio.io/use-waypoint: waypoint
#   # Add these labels or annotations to all istio objects when they are managed by
#   # Signadot. Note that virtual services are only managed by Signadot when they
#   # route to some sandbox. For virtual services, these labels or annotations are
#   # only added if they were not present before becoming managed by signadot.
#   additionalLabels:
#     exampleLabel: exampleLabelValue
#   additionalAnnotations:
#     exampleAnnotationKey: exampleAnnotationValue


# Linkerd settings
# -----------------------------------------------------------------------------
# linkerd:
#   # Enable the integration with Linkerd
#   enabled: true
#   gatewayAPI:
#     enabled: false
#   operator:
#     # Pod annotations for operator workloads on the Linkerd mesh
#     # Defaults to: linkerd.io/inject: "enabled"
#     podAnnotations:
#       linkerd.io/inject: enabled
#       config.linkerd.io/proxy-await: enabled


# Component settings
# -----------------------------------------------------------------------------

controllerManager:
  replicas: 2
  resources:
    limits:
      cpu: 100m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 512Mi
  # image: my-private-registry/signadot/controller-manager:latest
  # imagePullPolicy: Always
  # nodeAffinity: {}
  # tolerations: []

agent:
  resources:
    limits:
      memory: 2Gi
    requests:
      memory: 128Mi
  # image: my-private-registry/signadot/agent:latest
  # imagePullPolicy: Always
  # nodeAffinity: {}
  # tolerations: []

routeServer:
  resources:
    limits:
      memory: 2Gi
    requests:
      memory: 128Mi
  # image: my-private-registry/signadot/route-server:latest
  # imagePullPolicy: Always
  # nodeAffinity: {}
  # tolerations: []

ioContextServer:
  replicas: 1
  resources:
    limits:
      memory: 1Gi
    requests:
      memory: 128Mi
  # image: my-private-registry/signadot/io-context-server:latest
  # imagePullPolicy: Always
  # nodeAffinity: {}
  # tolerations: []

tunnel:
  api:
    replicas: 1
    resources:
      limits:
        memory: 1Gi
      requests:
        memory: 128Mi
    # image: my-private-registry/signadot/tunnel-api:latest
    # imagePullPolicy: Always
    # nodeAffinity: {}
    # tolerations: []
    # strategy:
    #   rollingUpdate:
    #     maxSurge: 25%
    #     maxUnavailable: 25%
    #   type: RollingUpdate
  proxy:
    replicas: 1
    resources:
      limits:
        memory: 2Gi
      requests:
        memory: 128Mi
    # image: my-private-registry/signadot/tunnel-proxy:latest
    # imagePullPolicy: Always
    # nodeAffinity: {}
    # tolerations: []
    # strategy:
    #   rollingUpdate:
    #     maxSurge: 25%
    #     maxUnavailable: 25%
    #   type: RollingUpdate
  # config:
  #   cidrs: |
  #     outboundIPs:
  #     - name: foo
  #       cidr: 10.80.0.0/12
  #       exclude: true
  #     version: 1
  #   externalDNS:
  #     server: http://10.20.10.2:8083
  #     syncInterval: 60
  #   disableSSH: false
  #   disableXAP: false

trafficManager:
  replicas: 2
  resources:
    limits:
      memory: 2Gi
    requests:
      memory: 128Mi
  # image: my-private-registry/signadot/traffic-manager:latest
  # imagePullPolicy: Always
  # nodeAffinity: {}
  # tolerations: []

