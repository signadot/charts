# Routing settings
# -----------------------------------------------------------------------------

# routing:
#   iptablesMode: nft
#   # Define a list of custom routing headers
#   customHeaders:
#     - header1
#     - header2
#   # Built-in routing-propagation channels Signadot encodes into Istio
#   # VirtualServices and Gateway API HTTPRoutes / GRPCRoutes. Omit to use
#   # the built-in default ([baggage, tracestate]); set to a subset (e.g.
#   # [baggage]) to restrict, or to [] to disable them entirely. Restricting
#   # this set shrinks per-routing-key mesh config, useful when complex
#   # VirtualServices approach etcd's 1.5MB limit. customHeaders are
#   # propagated independently of this setting.
#   defaultHeaders:
#     - baggage
#     - tracestate


# Traffic capture settings
# -----------------------------------------------------------------------------

# trafficCapture:
#   enabled: true
#   # Request headers to be elided from traffic captures
#   requestHeadersElide:
#     - header1
#     - header2
#   # Response headers to be elided from traffic captures
#   responseHeadersElide:
#     - header1
#     - header2


# Traffic manager settings
# -----------------------------------------------------------------------------

# trafficManager:
