# Bind the ClusterRole containing namespaced permissions to the
# controller-manager's ServiceAccount only in the specified namespaces.
{{- $allowedNamespaces := (include "getAllowedNamespaces" . | fromJsonArray) -}}
{{ range $namespace := $allowedNamespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: signadot-manager-namespaced
  namespace: {{ $namespace | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: signadot-manager-namespaced
subjects:
- kind: ServiceAccount
  name: signadot-controller-manager
  namespace: signadot
{{ end }}
# Bind the ClusterRole containing agent permissions to the agent's
# ServiceAccount only in the specified namespaces.
{{ range $namespace := $allowedNamespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: signadot-agent-namespaced
  namespace: {{ $namespace | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: signadot-agent-namespaced
subjects:
- kind: ServiceAccount
  name: agent
  namespace: signadot
{{ end }}
# Bind the pod-log ClusterRole to the agent's ServiceAccount in the specified
# namespaces. controlPlane.podLogAccess.enabled: false omits these bindings
# along with the ClusterRole itself; absent means enabled, so only an explicit
# false turns it off.
{{- if ne (include "valuesDefaultStr" (list .Values "controlPlane" "podLogAccess" "enabled") | trim) "false" }}
{{ range $namespace := $allowedNamespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: signadot-agent-podlog
  namespace: {{ $namespace | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: signadot-agent-podlog
subjects:
- kind: ServiceAccount
  name: agent
  namespace: signadot
{{ end }}
{{- end }}
