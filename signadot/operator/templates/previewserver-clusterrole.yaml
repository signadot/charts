{{ if ne (include "valuesDefaultStr" (list .Values "previewServer" "enabled") | trim) "false" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  annotations:
    {{- range $key, $val := .Values.commonAnnotations }}
    {{ $key | quote }}: {{ $val | quote }}
    {{- end }}
  labels:
    {{- range $key, $val := .Values.commonLabels }}
    {{ $key | quote }}: {{ $val | quote }}
    {{- end }}
  name: previewserver
rules:
- apiGroups:
  - signadot.com
  resources:
  - routingconfigs
  verbs:
  - get
  - list
  - watch
{{ end }}
