name: Release Charts

# This workflow creates a new chart release when changes are merged to the main branch.
# Each merge commit to main branch represents a deliberate release decision.

on:
  push:
    branches:
      - main
  workflow_dispatch:
    # Allow manual trigger for releases

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.4.0

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@cae68fefc6b5f367a0275617c9f83181ba54714f # v1.7.0
        with:
          charts_dir: signadot
          charts_repo_url: https://charts.signadot.com
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
